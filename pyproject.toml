[project]
name = "readtome"
version = "0.1.0"
description = "Turn PDF and EPUB books into chaptered audiobooks (M4B + MP3)"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "mutagen>=1.47",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
readtome = "readtome.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["readtome"]
